name: Deploy to Firebase [Ruuvi Station Android]

on:
  push:
    branches:
      - master
    paths-ignore:
      - 'docs/**'
      - 'fastlane/metadata/**'
      - 'README.md'

  workflow_dispatch:
    inputs:
      release_notes:
        description: 'Optional Firebase release notes'
        required: false
        default: ''
      firebase_groups:
        description: 'Optional Firebase tester group aliases'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Require manual branch builds to include current master
        if: github.event_name == 'workflow_dispatch' && github.ref_name != 'master'
        run: |
          git fetch --no-tags origin master

          if ! git merge-base --is-ancestor origin/master HEAD; then
            echo "::error::Branch '${{ github.ref_name }}' is not rebased on top of the current master branch. Rebase it onto origin/master and run the workflow again."
            exit 1
          fi

      - name: Set Firebase release notes branch
        env:
          DEPLOYMENT_BRANCH: ${{ github.ref_name }}
        run: |
          if [[ "$DEPLOYMENT_BRANCH" == "master" ]]; then
            RELEASE_NOTES_BRANCH="Master"
          else
            RELEASE_NOTES_BRANCH="$DEPLOYMENT_BRANCH"
          fi

          echo "FIREBASE_RELEASE_NOTES_PREFIX=(Branch: $RELEASE_NOTES_BRANCH)" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Validate CI secrets
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_TESTERS_GROUP: ${{ github.event.inputs.firebase_groups || vars.FIREBASE_TESTERS_GROUP }}
        run: |
          bash .github/scripts/validate_ci_secrets.sh \
            SIGNING_KEY \
            KEY_STORE_PASSWORD \
            ALIAS \
            KEY_PASSWORD

          if [[ -z "${FIREBASE_TESTERS_GROUP:-}" ]]; then
            echo "::error::Missing Firebase tester group. Set repository variable FIREBASE_TESTERS_GROUP or pass firebase_groups when running manually."
            exit 1
          fi

          if [[ -z "${FIREBASE_SERVICE_ACCOUNT_JSON:-}" ]]; then
            echo "::error::Missing Firebase auth. Set FIREBASE_SERVICE_ACCOUNT_JSON."
            exit 1
          fi

      - name: Set Android build metadata
        run: bash .github/scripts/set_android_build_metadata.sh

      - name: Run localization script
        run: ./scripts/ci/update_l10n.sh

      - name: Run unit tests
        run: ./gradlew :app:testWithoutFileLogsDebugUnitTest

      - name: Build and distribute AAB to Firebase
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_TESTERS_GROUP: ${{ github.event.inputs.firebase_groups || vars.FIREBASE_TESTERS_GROUP }}
          FIREBASE_RELEASE_NOTES: ${{ github.event.inputs.release_notes }}
          GITHUB_TOKEN: ${{ github.token }}
        run: bundle exec fastlane android deploy_to_firebase

      - name: Collect CI logs
        if: ${{ always() }}
        run: |
          mkdir -p ci-logs
          cp -f report.xml ci-logs/ 2>/dev/null || true
          cp -f fastlane/report.xml ci-logs/fastlane-report.xml 2>/dev/null || true

      - name: Stage tested release artifact
        if: ${{ success() }}
        run: |
          mkdir -p release-artifact
          cp app/build/outputs/bundle/withoutFileLogsRelease/*.aab release-artifact/
          aab_path="$(find release-artifact -maxdepth 1 -type f -name '*.aab' -print -quit)"
          {
            echo "ANDROID_VERSION_NAME=${RUUVI_APP_VERSION}"
            echo "ANDROID_VERSION_CODE=${RUUVI_BUILD_NUMBER}"
            echo "SOURCE_SHA=${GITHUB_SHA}"
            echo "FIREBASE_RUN_ID=${GITHUB_RUN_ID}"
            echo "AAB_SHA256=$(sha256sum "${aab_path}" | cut -d ' ' -f 1)"
          } > release-artifact/build-metadata.env

      - name: Upload Firebase-tested AAB
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: ruuvi-station-android-firebase-aab
          path: release-artifact/**
          if-no-files-found: error
          retention-days: 30

      - name: Upload release APK
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: ruuvi-station-android-firebase-apk
          path: app/build/outputs/apk/withoutFileLogs/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload CI logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ruuvi-station-android-firebase-ci-logs
          path: ci-logs/**
          if-no-files-found: ignore
          retention-days: 14

      - name: Write workflow summary
        if: ${{ always() }}
        env:
          DISTRIBUTION_CHANNEL: Firebase
          JOB_STATUS: ${{ job.status }}
          WORKFLOW_NAME: ${{ github.workflow }}
          REPOSITORY: ${{ github.repository }}
          BRANCH_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash .github/scripts/write_ci_summary.sh

      - name: Notify Telegram
        if: ${{ success() }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_SUCCESS_MENTION: ${{ secrets.TELEGRAM_SUCCESS_MENTION }}
          TELEGRAM_SUCCESS_TITLE: Firebase Android build is ready for testing.
          TELEGRAM_CHANGELOG_FILE: ${{ github.workspace }}/ci-logs/release_notes.txt
          DISTRIBUTION_CHANNEL: Firebase
          JOB_STATUS: ${{ job.status }}
          WORKFLOW_NAME: ${{ github.workflow }}
          REPOSITORY: ${{ github.repository }}
          BRANCH_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash .github/scripts/notify_telegram.sh
