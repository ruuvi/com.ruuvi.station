name: Upload to Google Play Internal

on:
  workflow_dispatch:
    inputs:
      firebase_run_id:
        description: 'Firebase workflow run ID containing the tested AAB'
        required: true
      release_notes:
        description: 'Optional Google Play internal release notes'
        required: false
        default: ''
      validation_only:
        description: 'Validate the Firebase artifact without uploading it to Google Play'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Validate CI secrets
        if: ${{ !inputs.validation_only }}
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.SERVICE_ACCOUNT_JSON }}
        run: |
          bash .github/scripts/validate_ci_secrets.sh SERVICE_ACCOUNT_JSON

      - name: Download Firebase-tested AAB
        uses: actions/download-artifact@v4
        with:
          name: ruuvi-station-android-firebase-aab
          path: release-artifact
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.inputs.firebase_run_id }}

      - name: Load and validate tested build metadata
        run: |
          set -a
          source release-artifact/build-metadata.env
          set +a

          if [[ "${FIREBASE_RUN_ID}" != "${{ github.event.inputs.firebase_run_id }}" ]]; then
            echo "::error::Downloaded artifact metadata does not match the requested Firebase run."
            exit 1
          fi

          if [[ ! "${ANDROID_VERSION_CODE}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Invalid Android version code in the Firebase artifact."
            exit 1
          fi

          aab_path="$(find release-artifact -maxdepth 1 -type f -name '*.aab' -print -quit)"
          if [[ -z "${aab_path}" ]]; then
            echo "::error::The Firebase artifact does not contain an AAB."
            exit 1
          fi

          actual_sha256="$(sha256sum "${aab_path}" | cut -d ' ' -f 1)"
          if [[ "${actual_sha256}" != "${AAB_SHA256}" ]]; then
            echo "::error::The downloaded AAB checksum does not match the Firebase-tested artifact."
            exit 1
          fi

          {
            echo "ANDROID_VERSION_NAME=${ANDROID_VERSION_NAME}"
            echo "ANDROID_VERSION_CODE=${ANDROID_VERSION_CODE}"
            echo "RUUVI_APP_VERSION=${ANDROID_VERSION_NAME}"
            echo "RUUVI_BUILD_NUMBER=${ANDROID_VERSION_CODE}"
            echo "PLAY_INTERNAL_AAB_PATH=${GITHUB_WORKSPACE}/${aab_path}"
            echo "TESTED_SOURCE_SHA=${SOURCE_SHA}"
          } >> "${GITHUB_ENV}"

      - name: Upload tested AAB to Google Play internal
        if: ${{ !inputs.validation_only }}
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          PLAY_INTERNAL_RELEASE_NOTES: ${{ github.event.inputs.release_notes }}
          GITHUB_TOKEN: ${{ github.token }}
        run: bundle exec fastlane android upload_to_play_internal

      - name: Collect CI logs
        if: ${{ always() }}
        run: |
          mkdir -p ci-logs
          cp -f report.xml ci-logs/ 2>/dev/null || true
          cp -f fastlane/report.xml ci-logs/fastlane-report.xml 2>/dev/null || true

      - name: Upload AAB
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: ruuvi-station-android-play-internal-aab
          path: ${{ env.PLAY_INTERNAL_AAB_PATH }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload CI logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ruuvi-station-android-play-internal-ci-logs
          path: ci-logs/**
          if-no-files-found: ignore
          retention-days: 14

      - name: Write workflow summary
        if: ${{ always() }}
        env:
          DISTRIBUTION_CHANNEL: ${{ inputs.validation_only && 'Firebase artifact validation' || 'Google Play internal' }}
          JOB_STATUS: ${{ job.status }}
          WORKFLOW_NAME: ${{ github.workflow }}
          REPOSITORY: ${{ github.repository }}
          BRANCH_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash .github/scripts/write_ci_summary.sh

      - name: Notify Telegram
        if: ${{ success() && !inputs.validation_only }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_SUCCESS_MENTION: ${{ secrets.TELEGRAM_SUCCESS_MENTION }}
          TELEGRAM_SUCCESS_TITLE: Google Play internal build uploaded
          TELEGRAM_SUCCESS_VERSION: ${{ env.RUUVI_APP_VERSION }}
          TELEGRAM_SUCCESS_BUILD: ${{ env.RUUVI_BUILD_NUMBER }}
          DISTRIBUTION_CHANNEL: Google Play internal
          JOB_STATUS: ${{ job.status }}
          WORKFLOW_NAME: ${{ github.workflow }}
          REPOSITORY: ${{ github.repository }}
          BRANCH_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash .github/scripts/notify_telegram.sh
